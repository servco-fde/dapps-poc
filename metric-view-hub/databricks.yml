bundle:
  name: metric-view-hub

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.

resources:
  apps:
    app:
      name: 'metric-view-hub'
      description: 'Metric view collaboration hub'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Query governed metric views as the signed-in user.
      user_api_scopes:
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://adb-4192082222593323.3.azuredatabricks.net

    # This Graph proof is bound only in the development workspace. The shared
    # app.yaml remains usable by the Hawaii BA target without a Graph secret.
    resources:
      apps:
        app:
          resources:
            - name: microsoft-graph-client-secret
              secret:
                scope: metric-view-hub-dev-graph
                key: client-secret
                permission: READ
          config:
            command: ['npm', 'run', 'start']
            env:
              - name: DATABRICKS_WAREHOUSE_ID
                value_from: sql-warehouse
              - name: LAKEBASE_ENDPOINT
                value_from: postgres
              - name: APP_ADMIN_EMAILS
                value: 'roberto.delgado@servco.com,tausif.islam@servco.com,iden.watanabe@servco.com,sam.ikemoto@servco.com,katerina.walter@servco.com'
              - name: MICROSOFT_GRAPH_TENANT_ID
                value: '9dbf86ac-e706-4657-a4ab-4e7f21704abc'
              - name: MICROSOFT_GRAPH_CLIENT_ID
                value: 'de20878a-8ec2-4238-a2c6-ea756cc9bf60'
              - name: MICROSOFT_GRAPH_CLIENT_SECRET
                value_from: microsoft-graph-client-secret

    variables:
      sql_warehouse_id: d789a5e994a1ea33
      postgres_branch: projects/metric-view-hub/branches/production
      postgres_database: projects/metric-view-hub/branches/production/databases/databricks-postgres
      postgres_project: projects/metric-view-hub

  # BA resource identifiers are intentionally required at invocation time. This
  # prevents a missing BA value from falling back to a development binding.
  hawaii-ba:
    workspace:
      host: https://adb-3146664464193453.13.azuredatabricks.net
